broker:
  user: "admin"
  password: "Password132"
  host: "localhost"
  port: 5672
  exchange_name: "notification"
  exchange_type: "direct"
  queue_name: "notifications.queue"
  routing_key: "notification"
  durable: true
  auto_delete: false
  exclusive: false
  no_wait: false
  reconnect_interval: 5 #seconds
scheduler:
  interval: 1 #minutes
  batch_size: 100
  cleanup_interval: 24 #hours
  cleanup_threshold: 8760 #hours (year by default)
logger:
  level: "INFO"
  file: "logs/scheduler.log"
storage:
  type: "database" #in-memory|database
  database:
    host: "localhost"
    port: 5432
    dbname: "calendar"
    user: "calendar_app"
    pass: "app_calendar"
    conn:
      lifetime: 5 #minutes
      max_open: 25
      max_idle: 25